
<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h2>Campus Connect</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <h1 id="registerHeading">Student Registration</h1>

        <button onclick="changeFontSize()">Change Font Size</button>
        <button onclick="toggleForm()">Show/Hide Form</button>

        <form id="registrationForm">
            <label>Student Name:</label>
            <input type="text" id="studentName">

            <label>Roll Number:</label>
            <input type="text" id="rollNumber">

            <label>Email Address:</label>
            <input type="email" id="email">

            <label>Select Event:</label>
            <select id="eventSelection">
                <option value="">Choose an event</option>
                <option>Rhythm Night</option>
                <option>Creative Minds</option>
                <option>CodeSprint</option>
                <option>Art and Expression</option>
            </select>

            <button type="button" onclick="registerStudent()">
                Register
            </button>
        </form>

        <p id="message"></p>
    </main>
</body>
</html>
